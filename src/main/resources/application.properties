spring.application.name=umadle-backend
server.servlet.context-path=/umadle
server.port=8080

# --- Datasource ---
spring.datasource.url=jdbc:postgresql://localhost:5432/umadle
spring.datasource.username=umadle
spring.datasource.password=umadle

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- CORS origin the frontend dev server runs on ---
umadle.cors.allowed-origins=http://localhost:5173
